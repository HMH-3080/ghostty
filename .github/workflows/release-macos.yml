name: Attach macOS build to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v1.3.2-rtl.2)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  macos:
    name: Build macOS (arm64)
    # Icon Composer (.icon) assets require the macOS 26 toolchain, and this
    # asset is an Apple Silicon build.
    runs-on: macos-26-arm64
    concurrency:
      group: macos-release-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Hide fork tag from version detection
        run: |
          # Ghostty's build panics on tags that are not exactly vX.Y.Z, and
          # this fork uses tags like v1.3.2-rtl.2. Remove the local tag so the
          # build treats the commit as a dev build.
          git tag -d "$TAG" || true
          git describe --exact-match --tags 2>&1 || echo "no exact tag (expected)"

      - name: Select latest Xcode 26 if available
        run: |
          if ls -d /Applications/Xcode_26*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          fi
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install zig@0.15 fribidi
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Build Ghostty.app
        run: |
          zig version
          zig build -Doptimize=ReleaseFast -Dfribidi=true

      - name: Debug xcodebuild failure
        if: failure()
        run: |
          find macos/build -maxdepth 3 -name "*.app" -print 2>/dev/null || true
          cd macos
          xcodebuild -target Ghostty -configuration ReleaseLocal 2>&1 | tail -150

      - name: Verify and package
        run: |
          # ReleaseFast maps to the Xcode ReleaseLocal configuration.
          test -d macos/build/ReleaseLocal/Ghostty.app
          # Ad-hoc signature so the app runs locally without a developer cert.
          codesign --force --deep -s - macos/build/ReleaseLocal/Ghostty.app || true
          ditto -c -k --sequesterRsrc --keepParent \
            macos/build/ReleaseLocal/Ghostty.app \
            "Ghostty-rtl-${TAG}-macos-arm64.zip"
          shasum -a 256 "Ghostty-rtl-${TAG}-macos-arm64.zip" > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "Ghostty-rtl-${TAG}-macos-arm64.zip" \
            SHA256SUMS-macos.txt \
            --clobber
